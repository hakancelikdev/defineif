site_name: defineif
site_description: A decorator that defines a method if the given condition is True.
site_url: https://defineif.hakancelik.dev

markdown_extensions:
  - fenced_code
  - footnotes
  - tables
  - codehilite
  - legacy_em
  - meta
  - sane_lists
  - smarty
  - toc:
      permalink: true
      baselevel: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: hakancelikdev
      repo: defineif
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid-experimental
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search:
      separator: '[\s\-\.]+'
      prebuild_index: true

  - git-revision-date-localized:
      type: date
      enable_creation_date: true

  - minify:
      minify_html: true

extra:
  version:
    provider: mike
    default: stable

  social:
    - icon: fontawesome/brands/discord
      link: https://discord.com/invite/6z8YXy4

    - icon: fontawesome/brands/twitter
      link: https://twitter.com/hakancelikdev

    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/hakancelikdev

    - icon: fontawesome/solid/globe
      link: https://hakancelik.dev

  analytics:
    provider: google
    property: G-2EGM5WWEED
  consent:
    title: Cookie consent
    description: >-
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better.

  homepage: https://defineif.hakancelik.dev

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - header.autohide

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to light mode

  font:
    text: Noto Sans
    code: Roboto Mono

  icon:
    repo: fontawesome/brands/github

copyright: Copyright &copy; 2020 - 2026 Hakan Çelik
repo_url: https://github.com/hakancelikdev/defineif
repo_name: hakancelikdev/defineif
edit_uri: https://github.com/hakancelikdev/defineif/tree/main/docs

nav:
  - Home: index.md
  - Contributing: CONTRIBUTING.md
  - Changelog: CHANGELOG.md
  - Authors: AUTHORS.md
