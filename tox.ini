[tox]
envlist = 3.9, 3.10, 3.11, 3.12, 3.13, pre-commit
isolated_build = true

[testenv]
deps =
    pytest==8.4.1
    pytest-cov==6.1.1
install_command = python -m pip install {opts} {packages}
commands =
    python -m pytest -v --cov defineif {posargs}


[testenv:pre-commit]
skip_install = true
deps = pre-commit
commands = pre-commit run --all-files
